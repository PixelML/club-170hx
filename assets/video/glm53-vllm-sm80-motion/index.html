<!DOCTYPE html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <title>PixelML benchmark video</title>
    <script src=".media/gsap.min.js"></script>
    <style>
      :root {
        --bg: #07111f;
        --panel: #111e30;
        --ink: #f4f7fb;
        --muted: #aab6c8;
        --mint: #36d7b0;
        --blue: #5c8dff;
        --amber: #f6b83f;
        --line: rgba(170, 182, 200, 0.2);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
      body { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #benchmark-stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 10%, rgba(54, 215, 176, 0.14), transparent 34%),
          radial-gradient(circle at 92% 75%, rgba(92, 141, 255, 0.13), transparent 40%),
          var(--bg);
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image:
          linear-gradient(rgba(170, 182, 200, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(170, 182, 200, 0.12) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 78%, transparent);
      }
      .shell { position: absolute; inset: 0; padding: 54px 64px 46px; }
      header { position: relative; z-index: 3; display: grid; grid-template-columns: 172px 1fr; gap: 28px; }
      .logo { width: 172px; height: 64px; display: flex; align-items: center; }
      .logo img { display: block; width: 166px; max-height: 62px; object-fit: contain; }
      .eyebrow { color: var(--mint); font-size: 21px; font-weight: 850; letter-spacing: 0.08em; }
      h1 { margin-top: 7px; font-size: 51px; line-height: 1; letter-spacing: -0.045em; }
      .subtitle { margin-top: 13px; color: var(--muted); font-size: 25px; font-weight: 680; }
      .hero { position: absolute; z-index: 3; top: 235px; left: 64px; width: 952px; }
      .hero-label { color: var(--muted); font-size: 22px; font-weight: 820; letter-spacing: 0.08em; }
      .hero-row { display: flex; align-items: center; gap: 22px; margin-top: 18px; }
      .headline { color: var(--mint); font-size: 73px; font-weight: 930; letter-spacing: -0.055em; line-height: 0.98; }
      .status { padding: 11px 20px; border: 1px solid rgba(54,215,176,.48); border-radius: 999px; color: var(--mint); background: rgba(54,215,176,.11); font-size: 22px; font-weight: 880; }
      .stage { position: absolute; z-index: 4; top: 420px; left: 64px; width: 952px; height: 452px; }
      .card {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(145deg, rgba(17,30,48,.98), rgba(9,21,37,.98));
        box-shadow: 0 28px 70px rgba(0,0,0,.28);
        opacity: 0;
      }
      .card-pad { height: 100%; padding: 42px; }
      .card-label { color: var(--muted); font-size: 24px; font-weight: 840; letter-spacing: .09em; }
      .proof-content { margin-top: 30px; }
      .card.has-visual .proof-content { display: grid; grid-template-columns: 290px 1fr; gap: 34px; align-items: center; }
      .visual-wrap { display: none; position: relative; width: 290px; height: 260px; padding: 10px; border: 1px solid rgba(170,182,200,.18); border-radius: 22px; background: #07111f; }
      .card.has-visual .visual-wrap { display: block; }
      .fixture { width: 268px; height: 238px; border-radius: 15px; }
      .fixture-caption { position: absolute; right: 20px; bottom: 20px; padding: 7px 10px; border-radius: 9px; background: rgba(7,17,31,.8); color: var(--ink); font-size: 15px; font-weight: 850; letter-spacing: .06em; }
      .proof-title { color: var(--ink); font-size: 42px; font-weight: 900; letter-spacing: -.035em; }
      .card.has-visual .proof-title { font-size: 35px; }
      .proof-body { max-width: 820px; margin-top: 18px; color: var(--muted); font-size: 27px; font-weight: 650; line-height: 1.35; }
      .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 34px; }
      .card.has-visual .metrics { margin-top: 24px; }
      .metric { min-height: 110px; padding: 20px 22px; border: 1px solid rgba(170,182,200,.16); border-radius: 20px; background: rgba(7,17,31,.72); }
      .metric strong { display: block; color: var(--mint); font-size: 38px; font-weight: 930; }
      .metric span { display: block; margin-top: 6px; color: var(--muted); font-size: 21px; font-weight: 680; }
      #summary-card .card-pad { padding: 30px 42px; }
      .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 18px; }
      .summary-item { min-height: 77px; padding: 11px 18px; border: 1px solid rgba(170,182,200,.16); border-radius: 18px; background: rgba(7,17,31,.7); }
      .summary-item strong { display: block; color: var(--mint); font-size: 25px; font-weight: 920; }
      .summary-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 17px; font-weight: 680; }
      .verdict { margin-top: 16px; color: var(--ink); font-size: 28px; font-weight: 900; letter-spacing: -.025em; }
      .limitation { margin-top: 10px; padding: 9px 14px; border-left: 4px solid var(--amber); background: rgba(246,184,63,.09); color: #f4d58d; font-size: 18px; font-weight: 760; }
      footer { position: absolute; z-index: 4; left: 64px; bottom: 42px; display: flex; justify-content: space-between; width: 952px; color: var(--muted); font-size: 18px; font-weight: 720; opacity: 0; }
      .pulse { position: absolute; z-index: 6; top: 412px; left: 64px; width: 4px; height: 468px; border-radius: 999px; background: var(--mint); box-shadow: 0 0 24px rgba(54,215,176,.82); }
    </style>
  </head>
  <body>
    <script id="benchmark-payload" type="application/json">{"title":"GLM-5.3-Flash · CMP 170HX","subtitle":"AWQ W4A16 · vLLM TP4 · MTP-3 · SM80","eyebrow":"MEASURED · SINGLE-STREAM + LADDER","headline":"56.4 TOK/S · C1","status":"37.0 TOK/S · C8","scenes":[{"label":"01 · SINGLE-STREAM RESULT","title":"2.1× EXL3 at C1","body":"AWQ W4A16 on four CMP 170HX cards; five repetitions, temperature 0.7, and 512 output tokens.","metrics":[{"value":"56.4 / 56.9","label":"median / peak tok/s"},{"value":"180 W","label":"per card power cap"}]},{"label":"02 · CONCURRENCY LADDER","title":"Communication-bound at C8","body":"The same TP4 boot reaches 37.0 tok/s aggregate at C8; the canonical 180 W EXL3 comparison is 44.6 under its separate protocol.","metrics":[{"value":"54.7","label":"C1 aggregate tok/s"},{"value":"37.0","label":"C8 aggregate tok/s"}]}],"summary":[{"value":"56.4","label":"tok/s median · C1"},{"value":"56.9","label":"tok/s peak · C1"},{"value":"37.0","label":"tok/s aggregate · C8"},{"value":"AWQ W4A16","label":"vLLM quantization"}],"verdict":"vLLM is the faster single-stream lane on 4× CMP 170HX.","limitation":"C8 is TP4 communication-bound; PP4 + MTP remains the next optimization.","footer":["AWQ W4A16 · MTP-3","4× CMP 170HX · 180 W/card","vLLM SM80 · MEASURED"]}</script>
    <div id="benchmark-stage" data-composition-id="pixelml-benchmark" data-start="0" data-width="1080" data-height="1080" data-duration="8">
      <div class="grid"></div>
      <div class="shell">
        <header>
          <div id="brand" class="logo"><img src=".media/images/pixelml-logo.svg" alt="PixelML"></div>
          <div>
            <div id="header-eyebrow" class="eyebrow"></div>
            <h1 id="title"></h1>
            <p id="subtitle" class="subtitle"></p>
          </div>
        </header>
        <section class="hero">
          <div id="evidence" class="hero-label"></div>
          <div class="hero-row"><strong id="headline" class="headline"></strong><span id="status" class="status"></span></div>
        </section>
        <main class="stage">
          <section id="proof-0" class="card"><div class="card-pad"><div class="card-label"></div><div class="proof-content"><div class="visual-wrap"><div class="fixture"></div><div class="fixture-caption"></div></div><div class="proof-copy"><div class="proof-title"></div><div class="proof-body"></div><div class="metrics"></div></div></div></div></section>
          <section id="proof-1" class="card"><div class="card-pad"><div class="card-label"></div><div class="proof-content"><div class="visual-wrap"><div class="fixture"></div><div class="fixture-caption"></div></div><div class="proof-copy"><div class="proof-title"></div><div class="proof-body"></div><div class="metrics"></div></div></div></div></section>
          <section id="summary-card" class="card"><div class="card-pad"><div class="card-label">VALIDATED RESULT</div><div id="summary-grid" class="summary-grid"></div><div id="verdict" class="verdict"></div><div id="limitation" class="limitation"></div></div></section>
        </main>
        <div id="pulse" class="pulse" data-layout-ignore="true"></div>
        <footer id="footer"><span></span><span></span><span></span></footer>
      </div>
    </div>
    <script>
      const data = JSON.parse(document.getElementById("benchmark-payload").textContent);
      const setText = (selector, value) => { document.querySelector(selector).textContent = value; };
      setText("#header-eyebrow", "REAL HARDWARE · PUBLIC RECIPE");
      setText("#title", data.title);
      setText("#subtitle", data.subtitle);
      setText("#evidence", data.eyebrow);
      setText("#headline", data.headline);
      setText("#status", data.status);
      const proofCards = [document.getElementById("proof-0"), document.getElementById("proof-1")];
      data.scenes.forEach((scene, index) => {
        const card = proofCards[index];
        card.querySelector(".card-label").textContent = scene.label;
        card.querySelector(".proof-title").textContent = scene.title;
        card.querySelector(".proof-body").textContent = scene.body;
        if (scene.fixture) {
          card.classList.add("has-visual");
          card.querySelector(".fixture").style.background = `linear-gradient(to bottom, ${scene.fixture.top}, ${scene.fixture.bottom})`;
          card.querySelector(".fixture-caption").textContent = scene.fixture.caption;
        }
        const metrics = card.querySelector(".metrics");
        scene.metrics.forEach((metric) => {
          const item = document.createElement("div");
          item.className = "metric";
          const value = document.createElement("strong");
          const label = document.createElement("span");
          value.textContent = metric.value;
          label.textContent = metric.label;
          item.append(value, label);
          metrics.append(item);
        });
      });
      const summary = document.getElementById("summary-grid");
      data.summary.forEach((metric) => {
        const item = document.createElement("div");
        item.className = "summary-item";
        const value = document.createElement("strong");
        const label = document.createElement("span");
        value.textContent = metric.value;
        label.textContent = metric.label;
        item.append(value, label);
        summary.append(item);
      });
      setText("#verdict", data.verdict);
      setText("#limitation", data.limitation);
      document.querySelectorAll("#footer span").forEach((node, index) => { node.textContent = data.footer[index]; });

      window.__timelines = window.__timelines || {};
      gsap.set("#pulse", { autoAlpha: 0, scaleY: 0.12, transformOrigin: "50% 50%" });
      const tl = gsap.timeline({ paused: true });
      window.__timelines["pixelml-benchmark"] = tl;
      tl.fromTo("#brand", { y: -18, autoAlpha: 1 }, { y: 0, autoAlpha: 1, duration: .35, ease: "power2.out" }, .05);
      tl.fromTo("#header-eyebrow, #title, #subtitle", { y: 18, autoAlpha: 1 }, { y: 0, autoAlpha: 1, duration: .42, stagger: .08, ease: "power3.out" }, .12);
      tl.fromTo("#evidence, #headline, #status", { y: 20, autoAlpha: 1 }, { y: 0, autoAlpha: 1, duration: .42, stagger: .1, ease: "power3.out" }, .42);
      tl.to("#pulse", { autoAlpha: 1, scaleY: 1, duration: .35 }, .82);
      tl.to("#pulse", { x: 948, duration: .48, ease: "power2.inOut" }, .9);
      tl.fromTo("#proof-0", { y: 32, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .4, ease: "power3.out" }, 1.15);
      tl.fromTo("#proof-0 .metric", { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .3, stagger: .1 }, 1.72);
      tl.to("#proof-0", { y: -20, autoAlpha: 0, duration: .24, ease: "power2.in" }, 2.82);
      tl.set("#pulse", { x: 948 }, 3.06);
      tl.to("#pulse", { x: 0, duration: .5, ease: "power2.inOut" }, 3.06);
      tl.fromTo("#proof-1", { y: 32, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .4, ease: "power3.out" }, 3.10);
      tl.fromTo("#proof-1 .metric", { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .3, stagger: .1 }, 3.72);
      tl.to("#proof-1", { y: -20, autoAlpha: 0, duration: .24, ease: "power2.in" }, 5.24);
      tl.fromTo("#summary-card", { y: 32, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .4, ease: "power3.out" }, 5.52);
      tl.fromTo(".summary-item", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .28, stagger: .1 }, 5.86);
      tl.fromTo("#verdict, #limitation", { x: 20, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .34, stagger: .16 }, 6.42);
      tl.fromTo("#footer", { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .3 }, 7.04);
      tl.to("#pulse", { x: 474, scaleY: .02, autoAlpha: .45, duration: .5 }, 7.08);
      tl.to("#summary-card", { scale: 1.006, duration: .24, yoyo: true, repeat: 1 }, 7.42);
      tl.seek(0);
      const previewTime = Number(new URL(window.location.href).searchParams.get("t"));
      if (Number.isFinite(previewTime)) tl.seek(previewTime);
    </script>
  </body>
</html>
