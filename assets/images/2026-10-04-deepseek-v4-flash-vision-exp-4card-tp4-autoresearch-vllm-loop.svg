<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="360" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2328">The autoresearch loop (after karpathy/autoresearch)</text>
  <text x="24" y="56" fill="#57606a">One agent, one repo, one score. 27 runs in 4 h 10 min. About 13 minutes per run (boot 6–11 min).</text>
  <g fill="#ddf4ff" stroke="#0969da">
    <rect x="24" y="84" width="170" height="110" rx="8"/><rect x="214" y="84" width="170" height="110" rx="8"/><rect x="404" y="84" width="170" height="110" rx="8"/><rect x="594" y="84" width="170" height="110" rx="8"/>
  </g>
  <rect x="784" y="84" width="172" height="110" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <g font-weight="bold" fill="#0969da"><text x="36" y="108">1. Edit</text><text x="226" y="108">2. Boot</text><text x="416" y="108">3. Gates (7)</text><text x="606" y="108">4. Speed</text></g>
  <text x="796" y="108" font-weight="bold" fill="#1a7f37">5. Keep or reset</text>
  <g fill="#1f2328">
    <text x="36" y="130">vLLM Python/Triton</text><text x="36" y="148">tree, serve.env,</text><text x="36" y="166">serve.args; git commit</text>
    <text x="226" y="130">fixed image + edited</text><text x="226" y="148">tree mounted over</text><text x="226" y="166">/vllm/vllm; TP4</text>
    <text x="416" y="130">greedy check, 5 answers,</text><text x="416" y="148">5 short-prompt probes,</text><text x="416" y="166">image, c4, alive, no Xid</text>
    <text x="606" y="130">prefill 2,941 tokens;</text><text x="606" y="148">c1 and c4 decode,</text><text x="606" y="166">400 tokens, 3 reps</text>
    <text x="796" y="130">score better: keep;</text><text x="796" y="148">else git reset;</text><text x="796" y="166">log in results.tsv</text>
  </g>
  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"><line x1="194" y1="140" x2="212" y2="140"/><line x1="384" y1="140" x2="402" y2="140"/><line x1="574" y1="140" x2="592" y2="140"/><line x1="764" y1="140" x2="782" y2="140"/></g>
  <path d="M870 194 L870 228 L109 228 L109 198" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="420" y="248" fill="#57606a">repeat, without asking the human</text>
  <text x="24" y="290" font-weight="bold" fill="#1f2328">Score, in order</text>
  <text x="24" y="312" fill="#1f2328">1. gates passed (7 of 7 required)   2. single-user decode tok/s   3. limit: 4-user total and prefill may not drop more than 10%</text>
  <text x="24" y="336" fill="#57606a">The agent may not change the bench, the image, the weights, the driver, the host or the power limit.</text>
</svg>
